name: Test mirrord 3.258.0 on Windows
on:
  push:
    branches: [test-mirrord-3.258.0]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: manifests/m/MetalBear/mirrord
      - name: Prepare WinGet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
          Repair-WinGetPackageManager -AllUsers
          $winget = (Get-AppxPackage Microsoft.DesktopAppInstaller).InstallLocation + '\winget.exe'
          "WINGET_EXE=$winget" >> $env:GITHUB_ENV
          & $winget --info
          if ($LASTEXITCODE) { throw 'WinGet setup failed' }
          & $winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { throw 'Cannot enable local manifests' }
      - name: Validate, install, launch, upgrade, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wg = $env:WINGET_EXE
          $manifest = 'manifests/m/MetalBear/mirrord/3.258.0'
          function Run-WinGet([string[]]$Arguments) {
            & $wg @Arguments
            if ($LASTEXITCODE) { throw "WinGet failed ($LASTEXITCODE): $Arguments" }
          }
          function Check-Installed {
            $exe = Join-Path ${env:ProgramFiles(x86)} 'mirrord\bin\mirrord.exe'
            if (!(Test-Path $exe)) { throw "Missing executable: $exe" }
            $version = & $exe --version
            if ($LASTEXITCODE -or $version -notmatch '3\.258\.0') { throw "Wrong CLI version: $version" }
            Write-Host "CLI: $version"
            & $exe --help
            if ($LASTEXITCODE) { throw 'CLI help failed' }
            $arp = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{96AC5229-89E0-4FE8-82D9-3A05FAACFE0A}'
            if ($arp.DisplayVersion -ne '1.3.2580' -or $arp.Publisher -ne 'MetalBear' -or $arp.DisplayName -ne 'mirrord') { throw 'ARP metadata mismatch' }
            $arp | Select-Object DisplayName,DisplayVersion,Publisher | Format-List
          }
          Run-WinGet @('validate','--manifest',$manifest)
          Run-WinGet @('install','--manifest',$manifest,'--silent','--accept-package-agreements','--accept-source-agreements','--disable-interactivity')
          Check-Installed
          Run-WinGet @('uninstall','--id','MetalBear.mirrord','--exact','--silent','--disable-interactivity')
          Run-WinGet @('install','--manifest','manifests/m/MetalBear/mirrord/3.246.0','--silent','--accept-package-agreements','--accept-source-agreements','--disable-interactivity')
          Run-WinGet @('install','--manifest',$manifest,'--silent','--accept-package-agreements','--accept-source-agreements','--disable-interactivity')
          Check-Installed
          $oldKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{61BB51FB-4D55-4738-8DDB-88A0B5AD5F31}'
          if (Test-Path $oldKey) { throw 'Old MSI registration remains after upgrade' }
          Run-WinGet @('uninstall','--id','MetalBear.mirrord','--exact','--silent','--disable-interactivity')
          if (Test-Path (Join-Path ${env:ProgramFiles(x86)} 'mirrord\bin\mirrord.exe')) { throw 'Executable remains after uninstall' }
          'PASS: validation, unattended installation, CLI launch, ARP metadata, upgrade from 3.246.0, and uninstall' >> $env:GITHUB_STEP_SUMMARY
      - name: Preserve WinGet logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winget-test-logs
          path: ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir
